# Passwordless public hackathon demo with server-side Supabase and OCR. Never commit secrets.
# Both services watch main. Root directories limit rebuilds to their own code.
envVarGroups:
  - name: esg-passport-demo-access
    envVars:
      - key: DEMO_ACCESS_ENABLED
        value: "true"
      # Keep the legacy SQLite sandbox disabled; the public homepage uses Supabase.
      - key: PUBLIC_WORKSPACE_ENABLED
        value: "false"
      # Visitors can use the live ESG demo without a password. Backend key stays private.
      - key: PUBLIC_LIVE_WORKSPACE_ENABLED
        value: "true"
      - key: BACKEND_SHARED_KEY
        generateValue: true

services:
  - type: web
    name: esg-passport-api
    runtime: python
    plan: free
    region: singapore
    branch: main
    autoDeployTrigger: commit
    # Backend imports src/ai/workflow and its requirements include a sibling path.
    # Do not set rootDir: src/backend; Render removes files outside rootDir.
    buildFilter:
      paths:
        - src/backend/**
        - src/ai/workflow/**
    buildCommand: pip install -r src/backend/requirements.txt
    startCommand: cd src/backend && uvicorn esg_backend.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - fromGroup: esg-passport-demo-access
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVER_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: esg-evidence
      - key: FRONTEND_ORIGIN
        sync: false
      - key: ALLOW_SAMPLE_RESET
        value: "false"

  - type: web
    name: esg-passport-web
    runtime: node
    plan: free
    region: singapore
    branch: main
    autoDeployTrigger: commit
    rootDir: src/frontend
    buildCommand: npm ci && npm run build
    startCommand: npm run start -- --hostname 0.0.0.0 --port $PORT
    healthCheckPath: /demo
    envVars:
      - fromGroup: esg-passport-demo-access
      - key: NODE_VERSION
        value: "22"
      - key: NEXT_PUBLIC_API_URL
        value: /api/backend
      - key: BACKEND_INTERNAL_URL
        sync: false
